[package]
name = "serde-unknown"
version = "0.1.0"
edition = "2024"
description = "Handle unknown fields during Serde deserialization."
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["std"]
std = ["compact_str/std", "derive_more/std", "serde/std", "serde_json?/std"]
peek = ["dep:serde_json"]

[dependencies]
compact_str = { version = "0.10.0", default-features = false }
derive_more = { version = "2.1.1", default-features = false, features = ["constructor", "deref", "deref_mut"] }
pastey = "0.2"
serde = { version = "1.0.229", default-features = false, features = ["alloc"] }
serde_json = { version = "1.0", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
