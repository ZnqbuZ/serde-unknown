[package]
name = "serde-unknown"
version = "0.1.0"
edition = "2024"
description = "Handle unknown fields during Serde deserialization."
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
compact_str = "0.10.0"
derive_more = { version = "2.1.1", features = ["constructor", "deref", "deref_mut"] }
pastey = "0.2"
serde = "1.0.229"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
